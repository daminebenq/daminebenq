<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="175" viewBox="0 0 1000 175" role="img" aria-labelledby="title desc">
  <title id="title">Project constellation</title><desc id="desc">Animated visualization connecting automation, artificial intelligence, open source, and gaming infrastructure.</desc>
  <defs><linearGradient id="line"><stop stop-color="#8b5cf6"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs>
  <rect width="1000" height="175" rx="18" fill="#0b1020"/>
  <g stroke="url(#line)" stroke-width="2" opacity=".5" stroke-dasharray="8 8">
    <path d="M125 88H875"><animate attributeName="stroke-dashoffset" values="0;-32" dur="2.5s" repeatCount="indefinite"/></path>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <g transform="translate(125 88)"><circle r="43" fill="#18122e" stroke="#8b5cf6"/><text y="-2" fill="#ddd6fe" font-size="17" font-weight="700">OPEN</text><text y="18" fill="#a78bfa" font-size="14">SOURCE</text><circle r="48" fill="none" stroke="#8b5cf6" opacity=".4"><animate attributeName="r" values="43;54;43" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="3s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(375 88)"><circle r="43" fill="#09212c" stroke="#22d3ee"/><text y="-2" fill="#cffafe" font-size="17" font-weight="700">TEST</text><text y="18" fill="#67e8f9" font-size="14">AUTOMATION</text><circle r="48" fill="none" stroke="#22d3ee" opacity=".4"><animate attributeName="r" values="43;54;43" dur="3s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="3s" begin=".7s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(625 88)"><circle r="43" fill="#11251a" stroke="#22c55e"/><text y="-2" fill="#dcfce7" font-size="17" font-weight="700">AI</text><text y="18" fill="#86efac" font-size="14">TOOLS</text><circle r="48" fill="none" stroke="#22c55e" opacity=".4"><animate attributeName="r" values="43;54;43" dur="3s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(875 88)"><circle r="43" fill="#2b1612" stroke="#f97316"/><text y="-2" fill="#ffedd5" font-size="17" font-weight="700">GAME</text><text y="18" fill="#fdba74" font-size="14">SYSTEMS</text><circle r="48" fill="none" stroke="#f97316" opacity=".4"><animate attributeName="r" values="43;54;43" dur="3s" begin="2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="3s" begin="2.1s" repeatCount="indefinite"/></circle></g>
  </g>
</svg>
