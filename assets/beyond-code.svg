<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Life beyond code</title><desc id="desc">Animated path between Tunisia and Brazil, surrounded by Mohamed's interests: pets, cycling, fitness, gaming, and music.</desc>
  <defs><linearGradient id="trail"><stop stop-color="#e11d48"/><stop offset=".5" stop-color="#f8fafc"/><stop offset="1" stop-color="#16a34a"/></linearGradient></defs>
  <rect width="1000" height="190" rx="18" fill="#0b1020"/>
  <text x="500" y="35" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="650">LIFE BEYOND CODE</text>
  <path d="M120 104 C310 30 690 170 880 86" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M120 104 C310 30 690 170 880 86" fill="none" stroke="url(#trail)" stroke-width="4" stroke-linecap="round" stroke-dasharray="70 700"><animate attributeName="stroke-dashoffset" values="0;-770" dur="5s" repeatCount="indefinite"/></path>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <g transform="translate(120 104)"><circle r="32" fill="#3b111c" stroke="#e11d48"/><text y="6" font-size="24">🇹🇳</text><text y="52" fill="#fda4af" font-size="13">ROOTS</text></g>
    <g transform="translate(310 73)"><circle r="25" fill="#172033" stroke="#64748b"/><text y="7" font-size="21">🐾</text><text y="43" fill="#94a3b8" font-size="12">PACK</text></g>
    <g transform="translate(500 107)"><circle r="25" fill="#172033" stroke="#64748b"/><text y="7" font-size="21">🚴</text><text y="43" fill="#94a3b8" font-size="12">RIDE</text></g>
    <g transform="translate(655 121)"><circle r="25" fill="#172033" stroke="#64748b"/><text y="7" font-size="21">🎮</text><text y="43" fill="#94a3b8" font-size="12">PLAY</text></g>
    <g transform="translate(880 86)"><circle r="32" fill="#102b19" stroke="#16a34a"/><text y="6" font-size="24">🇧🇷</text><text y="52" fill="#86efac" font-size="13">HOME</text></g>
  </g>
</svg>
